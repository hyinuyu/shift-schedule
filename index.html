          const s = localStorage.getItem(key);
          return s !== null ? JSON.parse(s) : initial;
        } catch { return initial; }
      });

      const bmr = Math.round(10 * p.wt + 6.25 * p.ht - 5 * p.age - 5);
      const tdee = Math.round(bmr * 1.55);
      const kcalTarget = Math.max(1500, tdee - 500);
      const proteinTarget = Math.round(p.wt * 2);
      const weeklyLoss = 0.5;
      const weeksToGoal = Math.max(1, Math.ceil((p.wt - p.target) / weeklyLoss));

    // ─────────────── 유틸 ───────────────
    const timeDiff = (a, b) => {
      const p = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
      let d = p(b) - p(a);
      if (d < 0) d += 1440;
      return d;
    };
    const fmtDur = m => {
      const h = Math.floor(m / 60), mm = m % 60;
      return h > 0 ? `${h}h${mm > 0 ? ` ${mm}m` : ''}` : `${mm}m`;
    };
    function calcStats(day) {
      let kcal = 0, p = 0, workMin = 0, exMin = 0, travelMin = 0;
      day.items.forEach((it, i) => {
        if (it.food && FOOD[it.food]) { kcal += FOOD[it.food].kcal; p += FOOD[it.food].p; }
        const next = day.items[i + 1];
        if (next) {
          const dur = timeDiff(it.t, next.t);
          if (it.act === 'workD' || it.act === 'workN') workMin += dur;
          if (it.act === 'workout') exMin += dur;
          if (it.act === 'travel') travelMin += dur;
        }
      });
      return { kcal, p, workMin, exMin, travelMin };
    }

          <svg width="96" height="96" className="-rotate-90">
            <circle cx="48" cy="48" r={r} stroke="#27272a" strokeWidth="6" fill="none" />
            <circle cx="48" cy="48" r={r} stroke={color} strokeWidth="6" fill="none"
              strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" />

          <div className="absolute text-center leading-tight">
            <div className="font-mono text-[15px] font-bold text-zinc-100">{value}</div>
            <div className="text-[9px] text-zinc-500 tracking-wider uppercase">{label}</div>

          <div className="space-y-2.5">
            {VITAMINS.map(v => (
              <div key={v.name} className="rounded-xl p-3 bg-zinc-900/60 border border-zinc-800">
                <div className="flex items-baseline justify-between gap-2 mb-1">
                  <div className="text-zinc-100 font-semibold text-[13px]">{v.name}</div>
                  <div className="font-mono text-[11px] text-pink-400">{v.dose}</div>
                </div>
                <div className="text-[11px] text-zinc-400 leading-snug">
                  <span className="text-pink-300">⏰ {v.when}</span> · {v.why}
                </div>
              </div>
            ))}
          </div>
          <div className="mt-3 text-[10.5px] text-zinc-500 leading-relaxed italic">
            ※ 응급의학과 의사이시니 본인 판단으로 멜라토닌 0.3-3mg (취침 30분 전) 단기 사용도 옵션. 다만 의존 가능성 고려.
          </div>
        </div>
      );
    }

    function GridView({ onSelect, onEditProfile }) {
      return (
        <div className="min-h-screen bg-zinc-950 safe-bottom">
          <div className="px-5 pt-12 pb-5 safe-top flex justify-between items-start">
            <div>
              <div className="font-display text-[11px] tracking-[0.3em] text-amber-400 mb-2">SHIFT · DIET · TRAINING</div>
              <h1 className="text-zinc-50 text-[28px] font-black leading-tight mb-1">오늘 내 근무는?</h1>
              <p className="text-zinc-500 text-[13px]">패턴을 골라 타임라인 · 식단 · 수면</p>
            </div>
            <button onClick={onEditProfile}
              className="w-11 h-11 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center active:scale-95 transition mt-1"
              aria-label="설정">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </button>
          </div>

          <div className="px-5 grid grid-cols-2 gap-3 pb-10 pt-3">
            {SHIFTS.map((s, i) => (
              <div key={s.id} className="slide-up" style={{ animationDelay: `${i * 40}ms` }}>
                <ShiftCard shift={s} onClick={() => onSelect(s)} />
              </div>
            ))}
          </div>

          <div className="px-5 pb-12">
            <div className="font-display text-[11px] tracking-[0.25em] text-zinc-400 mb-3">MAIN FOODS · KCAL / PROTEIN</div>
            <div className="space-y-2">
              {['점보400', '닭가슴살 볶음밥', '닭가슴살 스테이크'].map(name => (
                <div key={name} className="flex items-center justify-between p-3 rounded-2xl bg-zinc-900/60 border border-zinc-800">
                  <div className="text-zinc-200 text-sm font-medium">{name}</div>
                  <div className="flex gap-3 font-mono text-xs">
                    <span className="text-amber-400">{FOOD[name].kcal}kcal</span>
                    <span className="text-emerald-400">P {FOOD[name].p}g</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="font-display text-[11px] tracking-[0.25em] text-zinc-400 mt-6 mb-3">편의점 보조</div>
            <div className="text-[11px] text-zinc-400 leading-relaxed">
              삶은계란 (150/13) · 그릭요거트 (120/15) · 닭가슴살 소시지 2개 (160/26) · 프로틴 음료 (150/25) · 단백질바 (200/18) · 바나나 (90/1) · 두유 (100/9) · 견과류 (150/5)
            </div>

            <VitaminSection />

            <div className="mt-8 rounded-2xl p-4 border border-indigo-500/30 bg-indigo-500/5">
              <div className="font-display text-[10px] tracking-[0.3em] text-indigo-400 mb-2">SLEEP · CAFFEINE NOTES</div>
              <ul className="text-[12px] text-zinc-300 space-y-1.5 leading-relaxed">
                <li>· 카페인 t½ ≈ 5h → 취침 8h 전 컷오프</li>
                <li>· Anchor sleep: 4-5h는 같은 시간대 고정</li>
                <li>· Power nap 20분 (REM 전) / 90분 (1 cycle)</li>
                <li>· 나이트 퇴근 시 선글라스 → 멜라토닌 보존</li>
                <li>· 침실 18-20℃ · 암막 · 폰 30분 전 OFF</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [profile, setProfile] = usePersistedState('profile', DEFAULT_PROFILE);
      const [settings, setSettings] = usePersistedState('settings', DEFAULT_SETTINGS);
      const [checkedArr, setCheckedArr] = usePersistedState('checked', []);
      const [selected, setSelected] = useState(null);
      const [editing, setEditing] = useState(false);

      const macros = useMemo(() => computeMacros(profile), [profile]);
      const checked = useMemo(() => new Set(checkedArr), [checkedArr]);

      const toggleCheck = (key) => {
        setCheckedArr(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
      };

      return (
        <>
          {selected ? (
            <DetailView
              shift={selected}
              settings={settings}
              macros={macros}
              checked={checked}
              onToggleCheck={toggleCheck}
              onBack={() => setSelected(null)}
            />
          ) : (
            <GridView
              onSelect={setSelected}
              onEditProfile={() => setEditing(true)}
            />
          )}
          {editing && (
            <ProfileEditor
              profile={profile}
              settings={settings}
              onSave={(p, s) => { setProfile(p); setSettings(s); setEditing(false); }}
              onClose={() => setEditing(false)}
            />
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
