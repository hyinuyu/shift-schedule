    function computeMacros(p) {
      if (!isProfileComplete(p)) return null;
      const sexAdj = p.sex === 'F' ? -161 : 5;
      const bmr = Math.round(10 * p.wt + 6.25 * p.ht - 5 * p.age + sexAdj);
      const tdee = Math.round(bmr * 1.55);
      const kcalTarget = Math.max(1200, tdee - 500);
      const proteinTarget = Math.round(p.wt * 2);
      const weeklyLoss = 0.5;
      const diff = p.wt - p.target;
      const weeksToGoal = diff > 0 ? Math.ceil(diff / weeklyLoss) : 0;
      return { bmr, tdee, kcalTarget, proteinTarget, weeklyLoss, weeksToGoal };

    const timeDiff = (a, b) => {
      const p = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
      let d = p(b) - p(a);
      if (d < 0) d += 1440;
      return d;
    };
    const fmtDur = m => {
      const h = Math.floor(m / 60), mm = m % 60;
      return h > 0 ? `${h}h${mm > 0 ? ` ${mm}m` : ''}` : `${mm}m`;
    };
    function calcStats(day) {
      let kcal = 0, p = 0, workMin = 0, exMin = 0, travelMin = 0;
      day.items.forEach((it, i) => {
        if (it.food && FOOD[it.food]) { kcal += FOOD[it.food].kcal; p += FOOD[it.food].p; }
        const next = day.items[i + 1];
        if (next) {
          const dur = timeDiff(it.t, next.t);
          if (it.act === 'workD' || it.act === 'workN') workMin += dur;
          if (it.act === 'workout') exMin += dur;
          if (it.act === 'travel') travelMin += dur;
        }
      });
      return { kcal, p, workMin, exMin, travelMin };
    }

    async function hardRefresh() {
      try {
        if (navigator.serviceWorker?.controller) {
          navigator.serviceWorker.controller.postMessage('clearCache');
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch {}
      setTimeout(() => window.location.reload(), 350);
    }

    function PullToRefresh({ enabled, children }) {
      const [pull, setPull] = useState(0);
      const [refreshing, setRefreshing] = useState(false);
      const startY = useRef(null);
      const THRESHOLD = 70;

      useEffect(() => {
        if (!enabled || refreshing) return;
        const onStart = (e) => {
          if (window.scrollY > 0) { startY.current = null; return; }
          startY.current = e.touches[0].clientY;
        };
        const onMove = (e) => {
          if (startY.current === null) return;
          if (window.scrollY > 0) { startY.current = null; setPull(0); return; }
          const dy = e.touches[0].clientY - startY.current;
          if (dy > 0) setPull(Math.min(Math.pow(dy, 0.85), 130));
          else setPull(0);
        };
        const onEnd = () => {
          if (startY.current === null) return;
          startY.current = null;
          setPull((cur) => {
            if (cur > THRESHOLD) {
              setRefreshing(true);
              hardRefresh();
              return 60;
            }
            return 0;
          });
        };
        document.addEventListener('touchstart', onStart, { passive: true });
        document.addEventListener('touchmove', onMove, { passive: true });
        document.addEventListener('touchend', onEnd, { passive: true });
        document.addEventListener('touchcancel', onEnd, { passive: true });
        return () => {
          document.removeEventListener('touchstart', onStart);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          document.removeEventListener('touchcancel', onEnd);
        };
      }, [enabled, refreshing]);

      const reached = pull > THRESHOLD;
      const indicatorY = Math.min(pull, 80);
      const opacity = Math.min(pull / 30, 1);

      return (
        <>
          <div className="fixed left-0 right-0 flex items-start justify-center pointer-events-none z-[60]"
            style={{
              top: 'env(safe-area-inset-top, 0px)',
              transform: `translateY(${indicatorY - 80}px)`,
              opacity,
              transition: refreshing || pull === 0 ? 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s' : 'none',
            }}>
            <div className="mt-3 flex items-center gap-2 bg-zinc-900/95 backdrop-blur border border-zinc-700 px-3.5 py-2 rounded-full shadow-lg">
              <div className={`text-amber-400 text-base ${refreshing ? 'spin' : ''}`}
                style={{
                  transform: refreshing ? undefined : `rotate(${reached ? 180 : (pull / THRESHOLD) * 180}deg)`,
                  transition: refreshing ? undefined : 'transform 0.15s ease',
                  display: 'inline-block',
                }}>↓</div>
              <div className="text-zinc-200 text-[11px] font-semibold tracking-wide">
                {refreshing ? '새로고침 중...' : reached ? '놓으면 새로고침' : '당겨서 새로고침'}
              </div>
            </div>
          </div>
          <div style={{
            transform: `translateY(${pull}px)`,
            transition: pull === 0 || refreshing ? 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)' : 'none',
          }}>{children}</div>
        </>
      );
    }

            <div className="font-mono text-[15px] font-bold text-zinc-100">{value}</div>

            <div className="mt-8 rounded-2xl p-4 border border-indigo-500/30 bg-indigo-500/5">
              <div className="font-display text-[10px] tracking-[0.3em] text-indigo-400 mb-2">SLEEP · CAFFEINE NOTES</div>
              <ul className="text-[12px] text-zinc-300 space-y-1.5 leading-relaxed">
                <li>· 카페인 t½ ≈ 5h → 취침 8h 전 컷오프</li>
                <li>· Anchor sleep: 4-5h는 같은 시간대 고정</li>
                <li>· 나이트 퇴근 시 선글라스 → 멜라토닌 보존</li>
                <li>· 침실 18-20℃ · 암막 · 폰 30분 전 OFF</li>
                <li>· 위에서 아래로 당기면 새로고침</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [profile, setProfile] = usePersistedState('profile', EMPTY_PROFILE);
      const [settings, setSettings] = usePersistedState('settings', DEFAULT_SETTINGS);
      const [checkedArr, setCheckedArr] = usePersistedState('checked', []);
      const [selected, setSelected] = useState(null);
      const [editing, setEditing] = useState(false);

      const macros = useMemo(() => computeMacros(profile), [profile]);
      const checked = useMemo(() => new Set(checkedArr), [checkedArr]);

      const toggleCheck = (key) => {
        setCheckedArr(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
      };

      // History API: 뒤로가기 처리 (Android/iOS 시스템 뒤로가기 + 스와이프)
      useEffect(() => {
        if (selected) {
          window.history.pushState({ view: 'detail' }, '');
        }
      }, [selected]);

      useEffect(() => {
        if (editing) {
          window.history.pushState({ view: 'editor' }, '');
        }
      }, [editing]);

      useEffect(() => {
        const handler = () => {
          // 모달부터 닫고, 그다음 detail에서 main으로
          if (editing) setEditing(false);
          else if (selected) setSelected(null);
        };
        window.addEventListener('popstate', handler);
        return () => window.removeEventListener('popstate', handler);
      }, [selected, editing]);

      // UI 뒤로가기 버튼 → history.back() 호출하면 popstate 발생 → state 정리
      const goBack = () => window.history.back();
      const openEditor = () => setEditing(true);

      return (
        <>
          <PullToRefresh enabled={!editing}>
            {selected ? (
              <DetailView shift={selected} settings={settings} macros={macros}
                checked={checked} onToggleCheck={toggleCheck}
                onBack={goBack} onEditProfile={openEditor} />
            ) : (
              <GridView profile={profile} onSelect={setSelected} onEditProfile={openEditor} />
            )}
          </PullToRefresh>
          {editing && (
            <ProfileEditor profile={profile} settings={settings}
              onSave={(p, s) => { setProfile(p); setSettings(s); goBack(); }}
              onClose={goBack} />
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
